<script>
  const root = document.documentElement;
  const saved = localStorage.getItem("bonno-lang");
  if (saved === "en" || saved === "nl") root.dataset.lang = saved;
  function setLang(lang) {
    root.dataset.lang = lang;
    localStorage.setItem("bonno-lang", lang);
    document.querySelectorAll(".lang").forEach((b) => b.classList.toggle("on", b.dataset.set === lang));
  }
  document.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.set)));
  setLang(root.dataset.lang);
  const burger = document.querySelector(".burger");
  const drawer = document.getElementById("drawer");
  burger.addEventListener("click", () => drawer.classList.toggle("open"));
  const closeDrawer = () => drawer.classList.remove("open");
  window.addEventListener("scroll", closeDrawer, { passive: true });
  window.addEventListener("wheel", closeDrawer, { passive: true });
  window.addEventListener("touchmove", closeDrawer, { passive: true });
</script>
